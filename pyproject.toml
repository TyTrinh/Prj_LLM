[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prj-llm"
version = "0.1.0"
description = "Capstone Project: Building, Optimizing, and Aligning LLM from Scratch (Track B: Alignment & Safety)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "datasets>=2.18.0",
    "tiktoken>=0.6.0",
    "matplotlib>=3.8.0",
    "gradio>=4.20.0",
    "wandb>=0.16.0",
    "openai>=1.14.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
